name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / lint-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev --no-editable

      - name: Lint
        run: uv run --python 3.12 --frozen --no-editable ruff check .

      - name: Test
        # Local measurement is 75%; keep 1pt of headroom for CI variance.
        run: uv run --python 3.12 --frozen --no-editable python -m pytest --cov=polybot --cov-fail-under=74 --cov-report=term-missing

      - name: Generate SBOM (Python)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/polybot-requirements.txt" --quiet
          python -m pip install cyclonedx-bom --quiet
          cyclonedx-py --requirements "${RUNNER_TEMP}/polybot-requirements.txt" --output-format json --output-file dist/sbom.python.json
        continue-on-error: true

      - name: Audit Python production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/polybot-requirements.txt" --quiet
          uv run --python 3.12 --frozen --no-editable pip-audit -r "${RUNNER_TEMP}/polybot-requirements.txt" --progress-spinner off --no-deps --disable-pip --timeout 60

      - name: Build distributions
        run: uv build

  frontend:
    name: Frontend / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security and component tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build without Supabase configuration
        run: npm run build

      - name: Build with public Supabase configuration
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test
          NEXT_PUBLIC_SUPABASE_URL: https://project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM (Node)
        run: npm ls --all --json > "${RUNNER_TEMP}/sbom.node.json"
        continue-on-error: true

  frontend-e2e:
    name: Frontend / end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the console smoke suite
        # Deliberately runs without Supabase credentials: the suite proves the
        # unauthenticated paths (login, redirects, deployment check) stay usable.
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  container:
    name: Backend / container-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Zeabur image
        run: docker build --tag polybot-ci ./backend

  database:
    name: Supabase / migration-reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.101.0"
          github-token: ${{ github.token }}

      - name: Apply every migration to a fresh local database
        run: supabase db start

      - name: Rebuild the database from migrations
        run: supabase db reset --local

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  required:
    name: CI / required
    if: always()
    needs:
      - backend
      - frontend
      - frontend-e2e
      - container
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$FRONTEND_E2E_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
