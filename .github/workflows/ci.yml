name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / lint-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev --no-editable

      - name: Lint
        run: uv run --python 3.12 --frozen --no-editable ruff check .

      - name: Test
        run: uv run --python 3.12 --frozen --no-editable python -m pytest

      - name: Audit Python production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/polybot-requirements.txt" --quiet
          uv run --python 3.12 --frozen --no-editable pip-audit -r "${RUNNER_TEMP}/polybot-requirements.txt" --progress-spinner off --no-deps --disable-pip --timeout 60

      - name: Build distributions
        run: uv build

  frontend:
    name: Frontend / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Backend / container-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Zeabur image
        run: docker build --tag polybot-ci ./backend

  required:
    name: CI / required
    if: always()
    needs:
      - backend
      - frontend
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
